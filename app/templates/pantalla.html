<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sobreimpresos</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: transparent;
            overflow: hidden;
        }

        .live-badge {
            position: fixed;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            -webkit-text-stroke: 1px #1e1e1e;
            text-transform: uppercase;
            text-shadow: 1px -1px 2px rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: none;
        }

        #tickerBand {
            position: fixed;
            display: none;
            align-items: center;
            overflow: hidden;
            box-sizing: border-box;
            z-index: 900;
        }

        #tickerText {
            display: inline-block;
            white-space: nowrap;
        }

        #cronometroBand {
            position: fixed;
            display: none;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            z-index: 900;
        }

        #marcadorBand {
            position: fixed;
            display: none;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
            z-index: 900;
        }

        .ticker-dir-izquierda { padding-left: 100%; }
        .ticker-dir-derecha   { padding-left: 100%; }

        @keyframes ticker-scroll-izquierda {
            from { transform: translateX(0); }
            to   { transform: translateX(-100%); }
        }
        @keyframes ticker-scroll-derecha {
            from { transform: translateX(-100%); }
            to   { transform: translateX(0); }
        }

        #overlay-root {
            position: relative;
            width: 1920px;
            height: 1080px;
        }

        /* Independiente de overlay-root: no se borra cuando no hay graph activo */
        #mosca-root {
            position: fixed;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 950;
            pointer-events: none;
        }

        .capa {
            position: absolute;
            box-sizing: border-box;
            overflow: hidden;
        }

        .capa-media {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .capa-texto {
            display: flex;
            align-items: center;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .anim-fade-enter { animation: fadeIn var(--dur, 400ms) ease forwards; }
        .anim-fade-exit  { animation: fadeOut var(--dur, 400ms) ease forwards; }
        .anim-slide-enter { animation: slideIn var(--dur, 400ms) ease forwards; }
        .anim-slide-exit  { animation: slideOut var(--dur, 400ms) ease forwards; }

        @keyframes fadeIn  { from { opacity: 0; } to { opacity: var(--opacidad-final, 1); } }
        @keyframes fadeOut { from { opacity: var(--opacidad-final, 1); } to { opacity: 0; } }
        @keyframes slideIn  { from { opacity: 0; transform: translateX(var(--dir, -40px)); } to { opacity: var(--opacidad-final, 1); transform: translateX(0); } }
        @keyframes slideOut { from { opacity: var(--opacidad-final, 1); transform: translateX(0); } to { opacity: 0; transform: translateX(var(--dir, -40px)); } }

        .anim-ticker-enter { animation: tickerSlideIn 400ms ease forwards; }
        .anim-ticker-exit  { animation: tickerSlideOut 400ms ease forwards; }

        @keyframes tickerSlideIn  { from { opacity: 0; transform: translateX(100%) rotate(var(--angulo, 0deg)); } to { opacity: 1; transform: translateX(0) rotate(var(--angulo, 0deg)); } }
        @keyframes tickerSlideOut { from { opacity: 1; transform: translateX(0) rotate(var(--angulo, 0deg)); } to { opacity: 0; transform: translateX(100%) rotate(var(--angulo, 0deg)); } }
    </style>
</head>
<body>
<div class="live-badge" id="liveBadge"></div>
<div id="tickerBand"><span id="tickerText"></span></div>
<div id="cronometroBand"></div>
<div id="marcadorBand"></div>
<div id="overlay-root"></div>
<div id="mosca-root"></div>
<script src="{{ url_for('static', filename='js/ajuste-texto.js') }}"></script>
<script type="module" src="{{ url_for('static', filename='js/pantalla.js') }}"></script>
</body>
</html>
