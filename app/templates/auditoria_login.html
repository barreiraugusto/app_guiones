{% extends "base.html" %}
{% block extratitle %} - AUDITORÍA{% endblock %}

{% block extra_style %}
<style>
body {
    background: #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
    margin: 0;
}

.login-card {
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    padding: 2.5rem 2.8rem;
    width: 100%;
    max-width: 380px;
}

.login-icon {
    font-size: 2.8rem;
    color: #1565c0;
    margin-bottom: 0.4rem;
}

.login-title {
    font-size: 1.3rem;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 0.2rem;
}

.login-sub {
    font-size: 0.82rem;
    color: #8a9ab0;
    margin-bottom: 1.8rem;
}

.form-control:focus {
    border-color: #1565c0;
    box-shadow: 0 0 0 3px rgba(21,101,192,0.15);
}

.btn-ingresar {
    background: #1565c0;
    border: none;
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.05em;
    padding: 0.65rem;
    border-radius: 8px;
    width: 100%;
    font-size: 1rem;
    transition: background 0.2s;
}

.btn-ingresar:hover { background: #0d47a1; }

.error-msg {
    background: #fff0f0;
    border: 1px solid #f5c6cb;
    color: #721c24;
    border-radius: 7px;
    padding: 0.6rem 0.9rem;
    font-size: 0.88rem;
    margin-bottom: 1rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
}
</style>
{% endblock %}

{% block body %}
<div class="login-card text-center">
    <div class="login-icon"><i class="fas fa-shield-alt"></i></div>
    <div class="login-title">Log de Auditoría</div>
    <div class="login-sub">Área restringida — ingresá tu contraseña</div>

    {% if error %}
    <div class="error-msg">
        <i class="fas fa-exclamation-circle"></i> {{ error }}
    </div>
    {% endif %}

    <form method="POST">
        <div class="form-group text-left">
            <label class="small font-weight-bold mb-1" for="clave">Contraseña</label>
            <input
                type="password"
                id="clave"
                name="clave"
                class="form-control"
                placeholder="••••••••"
                autofocus
                autocomplete="current-password"
            >
        </div>
        <button type="submit" class="btn-ingresar mt-2">
            <i class="fas fa-sign-in-alt mr-1"></i> Ingresar
        </button>
    </form>

    <div class="mt-3">
        <a href="/" class="text-muted small">
            <i class="fas fa-arrow-left mr-1"></i>Volver al menú
        </a>
    </div>
</div>
{% endblock %}
