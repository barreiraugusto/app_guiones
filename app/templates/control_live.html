{% extends "base.html" %}
{% block title %}Control en vivo{% endblock %}

{% block extra_style %}
<style>
    body { padding-top: 70px; }

    #lienzo-wrapper {
        background: repeating-conic-gradient(#ccc 0% 25%, #eee 0% 50%) 50% / 20px 20px;
        position: relative;
        overflow: hidden;
        border: 1px solid #999;
        width: 100%;
        max-width: 960px;
        aspect-ratio: 16 / 9;
    }

    #lienzo-control {
        position: relative;
        width: 1920px;
        height: 1080px;
        transform: scale(0.5);
        transform-origin: top left;
    }

    .elemento-control {
        position: absolute;
        box-sizing: border-box;
        overflow: hidden;
    }

    .elemento-editable {
        border: 1px dashed rgba(0, 0, 0, 0.4);
        cursor: move;
    }

    .elemento-editable.seleccionada { border: 2px solid #0d6efd; }

    .resize-handle {
        position: absolute;
        width: 14px;
        height: 14px;
        background: #0d6efd;
        right: -7px;
        bottom: -7px;
        cursor: ns-resize;
    }

    .capa-media { width: 100%; height: 100%; object-fit: contain; }
    .capa-texto { display: flex; align-items: center; white-space: pre-wrap; word-wrap: break-word; }

    #ticker-editor {
        display: flex;
        align-items: center;
        font-weight: bold;
        padding: 0 10px;
        white-space: nowrap;
    }

    #live-editor {
        border-radius: 20px;
        color: #fff;
        font-weight: bold;
        padding: 5px 15px;
        white-space: nowrap;
    }
</style>
{% endblock extra_style %}

{% block body %}
<div class="container-fluid mt-4">
    <h2>Control en vivo</h2>
    <div class="row">
        <div class="col-md-9">
            <div id="lienzo-wrapper">
                <div id="lienzo-control"></div>
            </div>
        </div>
        <div class="col-md-3">
            <div id="panel-propiedades-control" class="card p-3">
                <p class="text-muted">Seleccioná el ticker o el badge Vivo para editar sus propiedades.</p>
            </div>
        </div>
    </div>
</div>
{% endblock body %}

{% block extra_script %}
<script src="{{ url_for('static', filename='js/control_live.js') }}"></script>
{% endblock extra_script %}
